<!DOCTYPE html>
<html lang="id">
<head>
  <script src="config.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sales Petik Profit | Compare Bonds</title>
  <link rel="icon" type="image/png" href="assets/logo/fawz.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1b4332; --purple: #14532d;
      --gold: #f5a623; --gold-light: #ffd43b;
      --bg: #f4f5fb; --white: #ffffff;
      --nav-h: 68px; --border: #e0e0ef;
      --text: #1a1a3a; --gray: #888;
      --green: #27ae60; --red: #e74c3c;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; padding-top: var(--nav-h); color: var(--text); }

    .page-container { max-width: 1600px; margin: 0 auto; padding: 36px 28px; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .page-title { font-size: 2rem; font-weight: 900; color: var(--navy); line-height: 1.1; }
    .page-subtitle { font-size: 0.88rem; color: var(--gray); margin-top: 4px; }
    .title-underline { width: 48px; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 2px; margin-top: 8px; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 11px 20px; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; white-space: nowrap; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg, var(--gold), #e8931a); color: #fff; box-shadow: 0 4px 14px rgba(245,166,35,0.35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(245,166,35,0.45); }
    .btn-outline { background: #fff; color: var(--navy); border: 1.5px solid var(--border); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); background: #fffbf3; }
    .btn-sm { padding: 8px 14px; font-size: 0.78rem; border-radius: 8px; }

    /* COMPARE LAYOUT */
    .compare-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .compare-grid { display: grid; gap: 24px; align-items: start; }
    .compare-grid.cols-2 { grid-template-columns: 1fr 1fr; }
    .compare-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

    /* CARD */
    .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
    .card-header { padding: 18px 20px 14px; border-bottom: 1px solid #f0f0f5; display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--gold), #e8931a); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; flex-shrink: 0; color: #fff; font-weight: 700; }
    .card-title { font-size: 0.92rem; font-weight: 700; color: var(--navy); }
    .card-subtitle { font-size: 0.72rem; color: var(--gray); margin-top: 2px; }
    .card-body { padding: 18px 20px; }

    /* BOND SEARCH PICKER */
    .bond-picker { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 2px solid #f0f0f5; }
    .bond-picker-label { font-size: 0.68rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .bond-search-wrap { position: relative; }
    .bond-search-input {
      width: 100%; padding: 10px 12px 10px 36px;
      border: 2px solid var(--border); border-radius: 10px;
      font-family: 'Inter', sans-serif; font-size: 0.84rem; color: var(--text);
      outline: none; transition: border 0.2s, box-shadow 0.2s; background: #fff;
    }
    .bond-search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,166,35,0.1); }
    .bond-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: #bbb; pointer-events: none; }
    .bond-search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; background: #eee; border: none; cursor: pointer; font-size: 0.7rem; color: #888; display: none; align-items: center; justify-content: center; }
    .bond-search-clear:hover { background: #ffd9d9; color: var(--red); }
    .bond-search-clear.visible { display: flex; }

    .bond-dropdown {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 300;
      background: #fff; border: 1.5px solid var(--border); border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12); max-height: 260px; overflow-y: auto;
    }
    .bond-dropdown.open { display: block; }
    .bond-dropdown-item {
      padding: 9px 12px; cursor: pointer; transition: background 0.12s;
      border-bottom: 1px solid #f5f5fa; display: flex; align-items: center; gap: 8px;
    }
    .bond-dropdown-item:last-child { border-bottom: none; }
    .bond-dropdown-item:hover, .bond-dropdown-item.focused { background: #fffbf3; }
    .bond-item-seri { font-weight: 700; color: var(--navy); font-size: 0.82rem; }
    .bond-item-meta { font-size: 0.7rem; color: var(--gray); margin-top: 1px; }
    .bond-item-cat { font-size: 0.62rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
    .cat-gov-idr { background: #e8f8f0; color: #27ae60; }
    .cat-gov-usd { background: #e8f0ff; color: #2d4abf; }
    .cat-korp-idr { background: #fffbf0; color: #b45309; }
    .cat-korp-usd { background: #f5f0ff; color: #15803d; }
    .bond-dropdown-empty { padding: 16px; text-align: center; color: #bbb; font-size: 0.8rem; }

    .bond-selected-chip {
      margin-top: 6px; padding: 7px 10px; border-radius: 8px;
      background: linear-gradient(135deg, #f0fff8, #e8fff2); border: 1.5px solid #a8e6c1;
      display: none; align-items: center; gap: 8px;
    }
    .bond-selected-chip.visible { display: flex; }
    .chip-seri { font-weight: 700; color: var(--navy); font-size: 0.82rem; }
    .chip-meta { font-size: 0.7rem; color: var(--gray); }
    .chip-clear { margin-left: auto; background: none; border: none; color: #aaa; cursor: pointer; font-size: 0.9rem; padding: 2px; border-radius: 4px; }
    .chip-clear:hover { color: var(--red); }

    /* FORM */
    .form-section { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #f5f5fa; }
    .form-section:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .form-section-label { font-size: 0.65rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .form-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-label { font-size: 0.68rem; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-label small { font-weight: 400; color: #aaa; text-transform: none; letter-spacing: 0; margin-left: 4px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-input, .form-select {
      padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 9px;
      font-family: 'Inter', sans-serif; font-size: 0.82rem; color: var(--text);
      outline: none; transition: border 0.2s, box-shadow 0.2s; background: #fff; width: 100%;
    }
    .form-input:focus, .form-select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,166,35,0.1); }
    .form-input.autofilled { background: #f8fff8; border-color: #b0e8c0; }
    .form-input.readonly { background: #f8f9ff; color: #555; }
    .input-suffix { position: relative; }
    .input-suffix .form-input { padding-right: 36px; }
    .input-suffix span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.72rem; color: #aaa; font-weight: 600; pointer-events: none; }

    /* RESULTS */
    .result-card { background: linear-gradient(145deg, var(--navy), #14532d); border-radius: 14px; padding: 14px 16px; color: #fff; margin-bottom: 10px; }

    /* CASHFLOW TABLE */
    .cf-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; margin-top: 12px; }
    .cf-table-wrap { overflow-x: auto; max-height: 380px; overflow-y: auto; }
    table.cf-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
    table.cf-table thead { background: linear-gradient(90deg, #f8f9ff, #fafafa); position: sticky; top: 0; z-index: 2; }
    table.cf-table thead th { padding: 6px 7px; text-align: left; font-size: 0.58rem; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap; border-bottom: 2px solid #f0f0f5; }
    table.cf-table thead th.right { text-align: right; }
    table.cf-table thead th.center { text-align: center; }
    table.cf-table tbody tr { border-bottom: 1px solid #f5f5fa; }
    table.cf-table tbody tr:hover { background: #fffbf3; }
    table.cf-table tbody tr.total-row { background: #fffbf0; font-weight: 700; border-top: 2px solid #f0e0b0; }
    table.cf-table tbody td { padding: 5px 7px; color: var(--text); vertical-align: middle; }
    table.cf-table tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }
    table.cf-table tbody td.center { text-align: center; }
    .period-badge { display: inline-block; min-width: 20px; height: 20px; border-radius: 5px; background: #f0f2ff; color: var(--navy); font-size: 0.62rem; font-weight: 700; text-align: center; line-height: 20px; padding: 0 3px; }
    .period-badge.mature { background: #fde8c8; color: #a85e00; }
    .amount-pos { color: var(--green); }
    .amount-neg { color: var(--red); }
    .nett-value { font-weight: 700; color: var(--navy); }
    .cf-footer { padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f0f0f5; font-size: 0.68rem; color: var(--gray); background: #fafafa; flex-wrap: wrap; gap: 4px; }

    /* SCENARIO TABLE */
    .scenario-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; margin-top: 12px; }
    .scenario-header { background: linear-gradient(135deg, #1b4332, #14532d); padding: 12px 16px; }
    .scenario-header h3 { font-size: 0.82rem; font-weight: 800; color: #fff; margin: 0; }
    .scenario-header p { font-size: 0.68rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
    table.scenario-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
    table.scenario-table thead { background: #f8f9ff; }
    table.scenario-table thead th { padding: 7px 10px; font-size: 0.6rem; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; text-align: right; border-bottom: 2px solid #e8e8f5; }
    table.scenario-table thead th:first-child { text-align: center; }
    table.scenario-table thead th:nth-child(2) { text-align: left; }
    table.scenario-table tbody td { padding: 7px 10px; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid #f5f5fa; }
    table.scenario-table tbody td:first-child { text-align: center; }
    table.scenario-table tbody td:nth-child(2) { text-align: left; color: #666; }
    table.scenario-table tbody tr.flat-row { background: #fffbf0; }

    /* DB STATUS */
    .db-status { display: inline-flex; align-items: center; gap: 5px; font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .db-status.ok { background: #e8f8f0; color: #27ae60; }
    .db-status.loading { background: #fff8e0; color: #a85e00; }
    .db-status.err { background: #fff0f0; color: var(--red); }

    /* LOADING SPINNER */
    .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TOGGLE SWITCH */
    .toggle-count { display: flex; align-items: center; gap: 8px; }
    .toggle-count label { font-size: 0.78rem; font-weight: 600; color: var(--navy); cursor: pointer; padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--border); transition: all 0.2s; }
    .toggle-count label.active { background: linear-gradient(135deg, var(--gold), #e8931a); color: #fff; border-color: transparent; box-shadow: 0 3px 10px rgba(245,166,35,0.3); }
    .toggle-count label:hover:not(.active) { border-color: var(--gold); color: var(--gold); }

    @media (max-width: 1100px) { .compare-grid.cols-3 { grid-template-columns: 1fr; } .compare-grid.cols-2 { grid-template-columns: 1fr; } }
    @media (max-width: 768px) { .page-container { padding: 20px 14px; } .compare-grid.cols-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="navbar.js?v=3"></script>

<div class="page-container">

  <div class="page-header">
    <div>
      <div class="page-title">Compare Bonds</div>
      <div class="page-subtitle">Bandingkan 2 atau 3 obligasi secara berdampingan — hitungan lengkap</div>
      <div class="title-underline"></div>
    </div>
    <div class="header-actions">
      <span class="db-status loading" id="db-status-badge">Memuat data...</span>
      <a href="bond-calculator.html" class="btn btn-outline btn-sm">Kalkulator IDR</a>
      <a href="bond-calculator-usd.html" class="btn btn-outline btn-sm">Kalkulator USD</a>
    </div>
  </div>

  <!-- CURRENCY & COUNT TOGGLE -->
  <div class="compare-controls">
    <span style="font-size:0.78rem;font-weight:600;color:var(--gray);">Mata Uang:</span>
    <div class="toggle-count">
      <label class="active" id="tog-idr" onclick="setCurrency('IDR')">IDR</label>
      <label id="tog-usd" onclick="setCurrency('USD')">USD</label>
    </div>
    <span style="font-size:0.78rem;font-weight:600;color:var(--gray);margin-left:20px;">Bandingkan:</span>
    <div class="toggle-count">
      <label class="active" id="tog-2" onclick="setCompareCount(2)">2 Obligasi</label>
      <label id="tog-3" onclick="setCompareCount(3)">3 Obligasi</label>
    </div>
  </div>

  <!-- COMPARE COLUMNS -->
  <div class="compare-grid cols-2" id="compare-grid">
    <!-- Columns will be rendered by JS -->
  </div>

  <!-- AI RECOMMENDATION PANEL -->
  <div id="ai-recommendation" style="display:none;margin-top:32px;"></div>

</div>

<!-- ===================================================
     JAVASCRIPT
==================================================== -->
<script>
// =============================================
// SUPABASE INIT
// =============================================
const SUPABASE_URL = (window.__FAWZ_CONFIG__ || {}).supabaseUrl || '';
const SUPABASE_KEY = (window.__FAWZ_CONFIG__ || {}).supabaseKey || '';
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allBonds = [];
let compareCount = 2;
let currency = 'IDR'; // 'IDR' or 'USD'

// State per column
const cols = [
  { selectedBond: null, filteredBonds: [], dropFocusIdx: -1 },
  { selectedBond: null, filteredBonds: [], dropFocusIdx: -1 },
  { selectedBond: null, filteredBonds: [], dropFocusIdx: -1 },
];

// Store calculation results per column for AI comparison
const calcResults = [null, null, null];

const CAT_LABELS = {
  'gov-idr':  { label: 'Gov IDR',  cls: 'cat-gov-idr'  },
  'gov-usd':  { label: 'Gov USD',  cls: 'cat-gov-usd'  },
  'korp-idr': { label: 'Korp IDR', cls: 'cat-korp-idr' },
  'korp-usd': { label: 'Korp USD', cls: 'cat-korp-usd' },
};

// =============================================
// LOAD BONDS
// =============================================
async function loadBonds() {
  setDbStatus('loading', 'Memuat...');
  try {
    const { data, error } = await _sb
      .from('obligasi_products')
      .select('id,seri,name,category,kupon,kupon_freq,jatuh_tempo,last_coupon_date,next_coupon_date,harga_modal,modal_to_sales,harga_to_customer,harga_jual,harga_beli,yield,day_count_basis,tanggal_listing,tanggal_update,penerbit,rating')
      .order('seri', { ascending: true });
    if (error) throw error;
    allBonds = data || [];
    setDbStatus('ok', `${allBonds.length} obligasi`);
    applyBondsFilter();
  } catch(e) {
    console.error('Load bonds error:', e);
    setDbStatus('err', 'Gagal memuat');
  }
}

function getBondsByCurrentCurrency() {
  if (currency === 'IDR') return allBonds.filter(b => b.category === 'gov-idr' || b.category === 'korp-idr');
  return allBonds.filter(b => b.category === 'gov-usd' || b.category === 'korp-usd');
}

function applyBondsFilter() {
  const filtered = getBondsByCurrentCurrency();
  cols.forEach(c => c.filteredBonds = [...filtered]);
  renderAllDropdowns();
}

// =============================================
// CURRENCY
// =============================================
function setCurrency(cur) {
  currency = cur;
  document.getElementById('tog-idr').classList.toggle('active', cur === 'IDR');
  document.getElementById('tog-usd').classList.toggle('active', cur === 'USD');
  // Update subtitle
  const sub = document.querySelector('.page-subtitle');
  if (sub) sub.textContent = `Bandingkan 2 atau 3 obligasi ${cur} secara berdampingan — hitungan lengkap`;
  // Clear selections when switching currency
  cols.forEach((c, i) => { c.selectedBond = null; });
  calcResults[0] = calcResults[1] = calcResults[2] = null;
  const aiPanel = document.getElementById('ai-recommendation');
  if (aiPanel) aiPanel.style.display = 'none';
  applyBondsFilter();
  renderColumns();
}

function setDbStatus(type, text) {
  const el = document.getElementById('db-status-badge');
  el.className = 'db-status ' + type;
  el.textContent = text;
}

// =============================================
// COMPARE COUNT
// =============================================
function setCompareCount(n) {
  compareCount = n;
  document.getElementById('tog-2').classList.toggle('active', n === 2);
  document.getElementById('tog-3').classList.toggle('active', n === 3);
  const grid = document.getElementById('compare-grid');
  grid.className = 'compare-grid cols-' + n;
  renderColumns();
}

// =============================================
// RENDER COLUMNS
// =============================================
function renderColumns() {
  const grid = document.getElementById('compare-grid');
  let html = '';
  for (let i = 0; i < compareCount; i++) {
    html += renderColumnHTML(i);
  }
  grid.innerHTML = html;
  // Re-populate dropdowns
  renderAllDropdowns();
  // Re-fill selected bonds if any
  for (let i = 0; i < compareCount; i++) {
    if (cols[i].selectedBond) {
      showSelectedChip(i, cols[i].selectedBond);
      fillForm(i, cols[i].selectedBond);
    }
  }
}

function renderColumnHTML(idx) {
  const label = idx === 0 ? 'A' : idx === 1 ? 'B' : 'C';
  const colors = ['#2d4abf', '#e8931a', '#15803d'];
  return `
  <div>
    <div class="card">
      <div class="card-header">
        <div class="card-icon" style="background:${colors[idx]};font-size:0.8rem;">${label}</div>
        <div>
          <div class="card-title">Obligasi ${label}</div>
          <div class="card-subtitle">Pilih dari database & isi nominal/harga</div>
        </div>
      </div>
      <div class="card-body">

        <!-- BOND PICKER -->
        <div class="bond-picker">
          <div class="bond-picker-label">Pilih Obligasi</div>
          <div class="bond-search-wrap" id="bond-search-container-${idx}">
            <span class="bond-search-icon">&#9906;</span>
            <input class="bond-search-input" id="bond-search-input-${idx}"
              placeholder="Ketik kode seri..."
              autocomplete="off"
              oninput="onBondSearch(${idx}, this.value)"
              onkeydown="onBondSearchKey(${idx}, event)"
              onfocus="openDropdown(${idx})"
            />
            <button class="bond-search-clear" id="bond-search-clear-${idx}" onclick="clearBondSelection(${idx})">✕</button>
            <div class="bond-dropdown" id="bond-dropdown-${idx}"></div>
          </div>
          <div class="bond-selected-chip" id="bond-selected-chip-${idx}">
            <div>
              <div class="chip-seri" id="chip-seri-${idx}">—</div>
              <div class="chip-meta" id="chip-meta-${idx}">—</div>
            </div>
            <button class="chip-clear" onclick="clearBondSelection(${idx})">✕</button>
          </div>
        </div>

        <!-- FORM -->
        <div class="form-section">
          <div class="form-section-label">Detail Obligasi</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Coupon <small>%</small></label>
              <div class="input-suffix">
                <input class="form-input" id="inp-coupon-${idx}" type="number" step="0.001" placeholder="7.125"/>
                <span>%</span>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Frekuensi</label>
              <select class="form-select" id="inp-freq-${idx}">
                <option value="2">Semi-Annual</option>
                <option value="4">Quarterly</option>
                <option value="1">Annual</option>
                <option value="12">Monthly</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Maturity</label>
              <input class="form-input" id="inp-maturity-${idx}" type="date"/>
            </div>
            <div class="form-group">
              <label class="form-label">Basis</label>
              <select class="form-select" id="inp-basis-${idx}">
                <option value="ACT/ACT">ACT/ACT</option>
                <option value="ACT/365">ACT/365</option>
                <option value="30/360">30/360</option>
                <option value="ACT/360">ACT/360</option>
              </select>
            </div>
          </div>
        </div>

        <!-- NOMINAL & PRICE -->
        <div class="form-section">

// =============================================
// BOND SEARCH / DROPDOWN
// =============================================
function renderDropdown(idx) {
  const dd = document.getElementById('bond-dropdown-' + idx);
  if (!dd) return;
  const bonds = cols[idx].filteredBonds;
  if (!bonds.length) {
    dd.innerHTML = '<div class="bond-dropdown-empty">Tidak ada obligasi yang cocok</div>';
    return;
  }
  dd.innerHTML = bonds.slice(0, 60).map((b, i) => {
    const cat = CAT_LABELS[b.category] || { label: b.category, cls: '' };
    const couponStr = b.kupon != null ? `Kupon ${parseFloat(b.kupon).toFixed(3)}%` : '';
    const matStr = b.jatuh_tempo ? ` | JT ${fmtDateShort(b.jatuh_tempo)}` : '';
    return `
    <div class="bond-dropdown-item" onclick="selectBond(${idx},${i})" onmouseover="cols[${idx}].dropFocusIdx=${i}">
      <span class="bond-item-cat ${cat.cls}">${cat.label}</span>
      <div style="flex:1;min-width:0;">
        <div class="bond-item-seri">${esc(b.seri)}</div>
        <div class="bond-item-meta">${couponStr}${matStr}</div>
      </div>
    </div>`;
  }).join('');
}

function renderAllDropdowns() {
  for (let i = 0; i < 3; i++) renderDropdown(i);
}

function openDropdown(idx) {
  const dd = document.getElementById('bond-dropdown-' + idx);
  if (dd) dd.classList.add('open');
}
function closeDropdown(idx) {
  const dd = document.getElementById('bond-dropdown-' + idx);
  if (dd) dd.classList.remove('open');
}

function onBondSearch(idx, q) {
  const clearBtn = document.getElementById('bond-search-clear-' + idx);
  if (clearBtn) clearBtn.classList.toggle('visible', q.length > 0);
  openDropdown(idx);
  const lq = q.toLowerCase();
  const currencyBonds = getBondsByCurrentCurrency();
  if (!lq) {
    cols[idx].filteredBonds = [...currencyBonds];
  } else {
    cols[idx].filteredBonds = currencyBonds.filter(b =>
      (b.seri && b.seri.toLowerCase().includes(lq)) ||
      (b.name && b.name.toLowerCase().includes(lq)) ||
      (b.penerbit && b.penerbit.toLowerCase().includes(lq))
    );
  }
  renderDropdown(idx);
}

function onBondSearchKey(idx, e) {
  const dd = document.getElementById('bond-dropdown-' + idx);
  const items = dd ? dd.querySelectorAll('.bond-dropdown-item') : [];
  if (e.key === 'ArrowDown') { e.preventDefault(); cols[idx].dropFocusIdx = Math.min(cols[idx].dropFocusIdx + 1, items.length - 1); updateDropFocus(idx, items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cols[idx].dropFocusIdx = Math.max(cols[idx].dropFocusIdx - 1, 0); updateDropFocus(idx, items); }
  else if (e.key === 'Enter') { if (cols[idx].dropFocusIdx >= 0) selectBond(idx, cols[idx].dropFocusIdx); }
  else if (e.key === 'Escape') { closeDropdown(idx); }
}

function updateDropFocus(idx, items) {
  items.forEach((el, i) => el.classList.toggle('focused', i === cols[idx].dropFocusIdx));
  if (items[cols[idx].dropFocusIdx]) items[cols[idx].dropFocusIdx].scrollIntoView({ block: 'nearest' });
}

// Close dropdowns on outside click
document.addEventListener('click', (e) => {
  for (let i = 0; i < 3; i++) {
    const container = document.getElementById('bond-search-container-' + i);
    if (container && !container.contains(e.target)) closeDropdown(i);
  }
});

// =============================================
// SELECT BOND
// =============================================
function selectBond(idx, bondIdx) {
  const b = cols[idx].filteredBonds[bondIdx];
  if (!b) return;
  cols[idx].selectedBond = b;
  closeDropdown(idx);

  const inp = document.getElementById('bond-search-input-' + idx);
  if (inp) inp.value = b.seri;
  const clearBtn = document.getElementById('bond-search-clear-' + idx);
  if (clearBtn) clearBtn.classList.add('visible');

  showSelectedChip(idx, b);
  fillForm(idx, b);
}

function showSelectedChip(idx, b) {
  const chip = document.getElementById('bond-selected-chip-' + idx);
  if (!chip) return;
  const cat = CAT_LABELS[b.category] || { label: b.category };
  const matStr = b.jatuh_tempo ? ` | JT ${fmtDateShort(b.jatuh_tempo)}` : '';
  const couponStr = b.kupon != null ? `Kupon ${parseFloat(b.kupon).toFixed(3)}%` : '';
  document.getElementById('chip-seri-' + idx).textContent = b.seri;
  document.getElementById('chip-meta-' + idx).textContent = `${cat.label} | ${couponStr}${matStr}`;
  chip.classList.add('visible');
}

function fillForm(idx, b) {
  if (b.kupon != null) { const el = document.getElementById('inp-coupon-' + idx); if (el) { el.value = parseFloat(b.kupon); el.classList.add('autofilled'); } }
  if (b.kupon_freq) {
    const freqMap = { 1: 12, 3: 4, 6: 2, 12: 1 };
    const perYear = freqMap[parseInt(b.kupon_freq)] || 2;
    const el = document.getElementById('inp-freq-' + idx);
    if (el) el.value = perYear;
  }
  if (b.jatuh_tempo) { const el = document.getElementById('inp-maturity-' + idx); if (el) { el.value = b.jatuh_tempo; el.classList.add('autofilled'); } }
  if (b.day_count_basis) {
    const basisMap = { 'ACT/ACT':'ACT/ACT', 'ACT/365':'ACT/365', '30/360':'30/360', 'ACT/360':'ACT/360' };
    const mapped = basisMap[b.day_count_basis];
    if (mapped) { const el = document.getElementById('inp-basis-' + idx); if (el) el.value = mapped; }
  }
  const price = b.harga_to_customer ?? b.harga_modal ?? b.harga_jual;
  if (price != null) { const el = document.getElementById('inp-price-' + idx); if (el) { el.value = parseFloat(price); el.classList.add('autofilled'); } }
}

function clearBondSelection(idx) {
  cols[idx].selectedBond = null;
  const inp = document.getElementById('bond-search-input-' + idx);
  if (inp) inp.value = '';
  const clearBtn = document.getElementById('bond-search-clear-' + idx);
  if (clearBtn) clearBtn.classList.remove('visible');
  const chip = document.getElementById('bond-selected-chip-' + idx);
  if (chip) chip.classList.remove('visible');
  cols[idx].filteredBonds = [...getBondsByCurrentCurrency()];
  renderDropdown(idx);
  ['inp-coupon-','inp-maturity-','inp-price-'].forEach(id => {
    const el = document.getElementById(id + idx);
    if (el) el.classList.remove('autofilled');
  });
}

// =============================================
// CALCULATION
// =============================================
function calculateCol(idx) {
  const coupon   = parseFloat(document.getElementById('inp-coupon-' + idx)?.value);
  const freq     = parseInt(document.getElementById('inp-freq-' + idx)?.value) || 2;
  const maturity = document.getElementById('inp-maturity-' + idx)?.value;
  const basis    = document.getElementById('inp-basis-' + idx)?.value || 'ACT/ACT';
  const nominalStr = (document.getElementById('inp-nominal-' + idx)?.value || '').replace(/\D/g,'');
  const nominal  = parseInt(nominalStr) || (currency === 'USD' ? 100000 : 1000000000);
  const price    = parseFloat(document.getElementById('inp-price-' + idx)?.value);
  const taxPct   = parseFloat(document.getElementById('inp-tax-' + idx)?.value) || 10;
  const sellPrice = parseFloat(document.getElementById('inp-sell-price-' + idx)?.value);

  if (!coupon || !maturity || !price) { alert('Harap isi Coupon, Maturity, dan Harga Beli untuk Obligasi ' + (idx===0?'A':idx===1?'B':'C')); return; }

  const today = new Date();
  const trade = toISO(today);
  const settle = toISO(addBusinessDays(today, 2));

  const cd = calcCouponDates(settle, maturity, freq);
  const lastCoupon = cd.last;
  const nextCoupon = cd.next;
  if (!lastCoupon || !nextCoupon) { alert('Gagal menghitung tanggal kupon.'); return; }

  const accruedAmt = calcAccruedInterest(settle, toISO(lastCoupon), toISO(nextCoupon), coupon, freq, nominal, basis);
  const accruedPct = (accruedAmt / nominal) * 100;
  const totalProceed = (price / 100) * nominal + accruedAmt;
  const cleanProceed = (price / 100) * nominal;

  const ytm = yieldFromPrice(settle, maturity, coupon, price, freq, basis);

  const couponAmt = (coupon / 100 / freq) * nominal;
  const couponNet = couponAmt * (1 - taxPct / 100);

  const daysToMat = Math.round((new Date(maturity + 'T00:00:00') - new Date(settle + 'T00:00:00')) / 86400000);

  // Generate cashflows
  const flows = generateCashflows(settle, maturity, coupon, freq, nominal, taxPct, basis);

  // Skenario EXIT
  const couponNett1Y = couponNet * freq;
  const totalCouponToMaturity = flows.reduce((s, f) => s + f.netCoupon, 0);

  // Render output
  const result = {
    coupon, freq, maturity, settle, nominal, price, ytm, taxPct, basis,
    accruedAmt, accruedPct, totalProceed, cleanProceed,
    couponAmt, couponNet, couponNett1Y, daysToMat,
    lastCoupon: toISO(lastCoupon), nextCoupon: toISO(nextCoupon),
    flows, totalCouponToMaturity, sellPrice,
    seri: cols[idx].selectedBond?.seri || ('Obligasi ' + (idx===0?'A':idx===1?'B':'C'))
  };

  calcResults[idx] = result;
  renderOutput(idx, result);

  // Check if we can generate AI recommendation
  generateAIRecommendation();
}

        <tr><td style="padding:6px 14px;color:#888;">Next Coupon</td><td style="padding:6px 14px;">${fmtDate(r.nextCoupon)}</td></tr>

// =============================================
// UTILITIES (same as bond-calculator.html)

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtIDR(n, dec=0) {
  if (n==null||isNaN(n)) return '—';
  if (currency === 'USD') return 'USD\u00a0'+Number(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return 'Rp\u00a0'+Number(n).toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtPct(n, dec=4) { if (n==null||isNaN(n)) return '—'; return Number(n).toFixed(dec)+'%'; }
function fmtNum(n, dec=2) { if (n==null||isNaN(n)) return '—'; return Number(n).toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtDate(d) { if(!d)return'—'; const dt=(d instanceof Date)?d:new Date(d+(d.length===10?'T00:00:00':'')); return dt.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function fmtDateShort(d) { if(!d)return'—'; const dt=(d instanceof Date)?d:new Date(d+(d.length===10?'T00:00:00':'')); return dt.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function addBusinessDays(d,n) { const r=new Date(d); let added=0; while(added<n){r.setDate(r.getDate()+1); if(r.getDay()!==0&&r.getDay()!==6)added++;} return r; }
function toISO(d) { const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function formatNominal(el) {
  const v = el.value.replace(/\D/g,'');
  if (!v) { el.value = ''; return; }
  if (currency === 'USD') {
    el.value = parseInt(v).toLocaleString('en-US');
  } else {
    el.value = parseInt(v).toLocaleString('id-ID');
  }
}

// =============================================
// COUPON DATE CALC
// =============================================
function calcCouponDates(settle, maturity, freqPerYear) {
  if (!settle||!maturity) return {last:null,next:null};
  const s=new Date(settle+'T00:00:00'); const mat=new Date(maturity+'T00:00:00');
  const mpp=Math.round(12/freqPerYear);
  let d=new Date(mat), iters=0;
  while(d>s&&iters<600){d=new Date(d.getFullYear(),d.getMonth()-mpp,d.getDate());iters++;}
  const last=new Date(d);
  const next=new Date(last.getFullYear(),last.getMonth()+mpp,last.getDate());
  return {last,next};
}

// =============================================
// ACCRUED INTEREST
// =============================================
function days30_360(d1,d2) {
  let y1=d1.getFullYear(),m1=d1.getMonth()+1,day1=d1.getDate();
  let y2=d2.getFullYear(),m2=d2.getMonth()+1,day2=d2.getDate();
  if(day1===31)day1=30; if(day2===31)day2=30;
  return 360*(y2-y1)+30*(m2-m1)+(day2-day1);
}

function calcAccruedInterest(settle, lastCoupon, nextCoupon, couponRate, freqPerYear, nominal, basis) {
  if(!settle||!lastCoupon||!nextCoupon)return 0;
  const s=new Date(settle+'T00:00:00'); const lc=new Date(lastCoupon+'T00:00:00'); const nc=new Date(nextCoupon+'T00:00:00');
  let daysAccrued, periodDays;
  if(basis==='30/360'){daysAccrued=days30_360(lc,s);periodDays=360/freqPerYear;}
  else if(basis==='ACT/360'){daysAccrued=(s-lc)/86400000;periodDays=360/freqPerYear;}
  else if(basis==='ACT/365'){daysAccrued=(s-lc)/86400000;periodDays=365/freqPerYear;}
  else{daysAccrued=(s-lc)/86400000;periodDays=(nc-lc)/86400000;}
  if(periodDays<=0)return 0;
  return (couponRate/100/freqPerYear)*(daysAccrued/periodDays)*nominal;
}

// =============================================
// PRICE FROM YIELD
// =============================================
function priceFromYield(settle, maturity, coupon, ytm, freqPerYear, basis) {
  if(!settle||!maturity)return null;
  const {last:lc,next:nc}=calcCouponDates(settle,maturity,freqPerYear);
  if(!lc||!nc)return null;
  const s=new Date(settle+'T00:00:00'); const mat=new Date(maturity+'T00:00:00');
  const c=coupon/100/freqPerYear; const y=ytm/100/freqPerYear;
  const mpp=Math.round(12/freqPerYear);
  let dsc,E;
  if(basis==='30/360'){dsc=days30_360(s,nc);E=days30_360(lc,nc);}
  else if(basis==='ACT/360'){dsc=(nc-s)/86400000;E=360/freqPerYear;}
  else if(basis==='ACT/365'){dsc=(nc-s)/86400000;E=365/freqPerYear;}
  else{dsc=(nc-s)/86400000;E=(nc-lc)/86400000;}
  let N=1,d=new Date(nc);
  while(d<mat){d=new Date(d.getFullYear(),d.getMonth()+mpp,d.getDate());if(d<=mat)N++;}
  const W=dsc/E;
  if(Math.abs(y)<1e-10)return(N*c+1)*100;
  let price=0;
  for(let k=1;k<=N;k++)price+=c/Math.pow(1+y,k-1+W);
  price+=1/Math.pow(1+y,N-1+W);
  price-=((E-dsc)/E)*c;
  return price*100;
}

// =============================================
// YIELD FROM PRICE
// =============================================
function yieldFromPrice(settle, maturity, coupon, price, freqPerYear, basis) {
  let lo=0.0001,hi=0.5,ytm=coupon/100;
  for(let i=0;i<200;i++){
    const mid=(lo+hi)/2;
    const p=priceFromYield(settle,maturity,coupon,mid*100,freqPerYear,basis);
    if(p===null)break;
    if(Math.abs(p-price)<0.00001){ytm=mid;break;}
    p>price?(lo=mid):(hi=mid);
    ytm=mid;
  }
  return ytm*100;
}

// =============================================
// CASHFLOW SCHEDULE
// =============================================
function generateCashflows(settle, maturity, coupon, freqPerYear, nominal, taxPct, basis) {
  const mpp=Math.round(12/freqPerYear);
  const mat=new Date(maturity+'T00:00:00'); const s=new Date(settle+'T00:00:00');
  const dates=[];
  let d=new Date(mat),iters=0;
  while(d>s&&iters<600){dates.unshift(new Date(d));d=new Date(d.getFullYear(),d.getMonth()-mpp,d.getDate());iters++;}
  const couponPerPeriod=(coupon/100/freqPerYear)*nominal;
  return dates.map((cfDate,i)=>{
    const isMature=cfDate.getTime()===mat.getTime();
    const grossCoupon=couponPerPeriod;
    const tax=grossCoupon*(taxPct/100);
    const netCoupon=grossCoupon-tax;
    const principal=isMature?nominal:0;
    const nett=netCoupon+principal;
    return {period:i+1,date:cfDate,grossCoupon,tax,netCoupon,principal,nett,isMature};
  });
}

// =============================================
// AI RECOMMENDATION ENGINE
// =============================================
function generateAIRecommendation() {
  const panel = document.getElementById('ai-recommendation');
  if (!panel) return;

  // Get active results
  const activeResults = [];
  for (let i = 0; i < compareCount; i++) {
    if (calcResults[i]) activeResults.push({ idx: i, ...calcResults[i] });
  }

  // Need at least 2 results to compare
  if (activeResults.length < 2) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';

  // ---- SCORING SYSTEM ----
  const scores = activeResults.map(r => {
    const label = r.idx === 0 ? 'A' : r.idx === 1 ? 'B' : 'C';
    return { label, seri: r.seri, idx: r.idx, score: 0, reasons: [], data: r };
  });

  // 1. YTM (higher = better) — weight 30
  const ytms = scores.map(s => s.data.ytm);
  const maxYTM = Math.max(...ytms);
  const minYTM = Math.min(...ytms);
  scores.forEach(s => {
    const ytmScore = (maxYTM - minYTM) > 0 ? ((s.data.ytm - minYTM) / (maxYTM - minYTM)) * 30 : 15;
    s.score += ytmScore;
    if (s.data.ytm === maxYTM && maxYTM !== minYTM) s.reasons.push({ type: 'positive', text: `YTM tertinggi (${fmtPct(s.data.ytm,3)})` });
    if (s.data.ytm === minYTM && maxYTM !== minYTM) s.reasons.push({ type: 'negative', text: `YTM terendah (${fmtPct(s.data.ytm,3)})` });
  });

  // 2. Coupon Rate (higher = better for income) — weight 20
  const coupons = scores.map(s => s.data.coupon);
  const maxCoupon = Math.max(...coupons);
  const minCoupon = Math.min(...coupons);
  scores.forEach(s => {
    const couponScore = (maxCoupon - minCoupon) > 0 ? ((s.data.coupon - minCoupon) / (maxCoupon - minCoupon)) * 20 : 10;
    s.score += couponScore;
    if (s.data.coupon === maxCoupon && maxCoupon !== minCoupon) s.reasons.push({ type: 'positive', text: `Kupon tertinggi (${s.data.coupon}% p.a.)` });
  });

  // 3. Nett Coupon per year (higher = better) — weight 15
  const nettCoupons = scores.map(s => s.data.couponNett1Y);
  const maxNettCoupon = Math.max(...nettCoupons);
  scores.forEach(s => {
    const ncScore = maxNettCoupon > 0 ? (s.data.couponNett1Y / maxNettCoupon) * 15 : 7.5;
    s.score += ncScore;
    if (s.data.couponNett1Y === maxNettCoupon && activeResults.length > 1 && nettCoupons.filter(x=>x===maxNettCoupon).length === 1) {
      s.reasons.push({ type: 'positive', text: `Pendapatan kupon nett/tahun terbesar (${fmtIDR(s.data.couponNett1Y)})` });
    }
  });

  // 4. Price discount (lower price = better value, more upside potential) — weight 15
  const prices = scores.map(s => s.data.price);
  const minPrice = Math.min(...prices);
  const maxPrice = Math.max(...prices);
  scores.forEach(s => {
    const priceScore = (maxPrice - minPrice) > 0 ? ((maxPrice - s.data.price) / (maxPrice - minPrice)) * 15 : 7.5;
    s.score += priceScore;
    if (s.data.price < 100 && s.data.price === minPrice && maxPrice !== minPrice) {
      s.reasons.push({ type: 'positive', text: `Harga beli terdiskon (${fmtNum(s.data.price,2)}% < par)` });
    }
    if (s.data.price > 100 && s.data.price === maxPrice && maxPrice !== minPrice) {
      s.reasons.push({ type: 'negative', text: `Harga beli premium (${fmtNum(s.data.price,2)}% > par)` });
    }
  });

  // 5. Hold to Maturity return p.a. (higher = better) — weight 20
  const htmReturns = scores.map(s => {
    const holdToMatReturn = s.data.nominal + s.data.totalCouponToMaturity;
    const holdToMatPL = holdToMatReturn - s.data.totalProceed;
    const holdToMatPct = (holdToMatPL / s.data.totalProceed) * 100;
    const years = s.data.daysToMat / 365;
    return years > 0 ? holdToMatPct / years : 0;
  });
  const maxHTM = Math.max(...htmReturns);
  const minHTM = Math.min(...htmReturns);
  scores.forEach((s, i) => {
    const htmScore = (maxHTM - minHTM) > 0 ? ((htmReturns[i] - minHTM) / (maxHTM - minHTM)) * 20 : 10;
    s.score += htmScore;
    s.htmReturn = htmReturns[i];
    if (htmReturns[i] === maxHTM && maxHTM !== minHTM) s.reasons.push({ type: 'positive', text: `Return HTM p.a. terbaik (${htmReturns[i].toFixed(2)}%)` });
  });

  // 6. Duration/Tenor consideration
  const tenors = scores.map(s => s.data.daysToMat);
  const minTenor = Math.min(...tenors);
  const maxTenor = Math.max(...tenors);
  scores.forEach(s => {
    const years = (s.data.daysToMat / 365).toFixed(1);
    if (s.data.daysToMat === minTenor && maxTenor !== minTenor) {
      s.reasons.push({ type: 'info', text: `Tenor terpendek (${years} tahun) — risiko durasi lebih rendah` });
    }
    if (s.data.daysToMat === maxTenor && maxTenor !== minTenor) {
      s.reasons.push({ type: 'info', text: `Tenor terpanjang (${years} tahun) — potensi volatilitas harga lebih tinggi` });
    }
  });

  // Sort by score
  scores.sort((a, b) => b.score - a.score);

  const winner = scores[0];
  const others = scores.slice(1);
  const scoreDiff = scores[0].score - scores[1].score;

  // Determine confidence level
  let confidence, confidenceColor, confidenceLabel;
  if (scoreDiff > 15) { confidence = 'tinggi'; confidenceColor = '#27ae60'; confidenceLabel = 'Rekomendasi Kuat'; }
  else if (scoreDiff > 5) { confidence = 'sedang'; confidenceColor = '#f5a623'; confidenceLabel = 'Rekomendasi Moderat'; }
  else { confidence = 'rendah'; confidenceColor = '#888'; confidenceLabel = 'Hampir Setara'; }

  // Build recommendation text
  let mainText = '';
  if (scoreDiff > 5) {
    mainText = `Berdasarkan analisis komparatif, <strong>Obligasi ${winner.label} (${esc(winner.seri)})</strong> merupakan pilihan yang lebih menarik`;
    if (winner.reasons.filter(r => r.type === 'positive').length > 0) {
      mainText += ' karena ' + winner.reasons.filter(r => r.type === 'positive').map(r => r.text.toLowerCase()).join(', ');
    }
    mainText += '.';
  } else {
    mainText = `Kedua obligasi memiliki profil yang <strong>hampir setara</strong>. Pemilihan bergantung pada preferensi investor terhadap tenor, likuiditas, dan strategi hold.`;
  }

  // Comparison table
  const compCols = scores.map(s => `<th style="padding:8px 12px;text-align:center;font-size:0.72rem;font-weight:700;color:${s===winner?'#27ae60':'var(--navy)'};">
    ${s===winner?'<strong>★</strong> ':''}Obligasi ${s.label}<br/><span style="font-weight:400;color:#888;font-size:0.68rem;">${esc(s.seri)}</span>
  </th>`).join('');

  const metrics = [
    { label: 'YTM', key: 'ytm', fmt: v => fmtPct(v, 3), better: 'high' },
    { label: 'Coupon', key: 'coupon', fmt: v => v + '% p.a.', better: 'high' },
    { label: 'Harga Beli', key: 'price', fmt: v => fmtNum(v, 3) + '%', better: 'low' },
    { label: 'Kupon Nett/Tahun', key: 'couponNett1Y', fmt: v => fmtIDR(v), better: 'high' },
    { label: 'Total Proceed', key: 'totalProceed', fmt: v => fmtIDR(v), better: 'low' },
    { label: 'Return HTM p.a.', key: 'htmReturn', fmt: v => v.toFixed(2) + '%', better: 'high' },
    { label: 'Tenor', key: 'daysToMat', fmt: v => (v/365).toFixed(1) + ' tahun', better: 'neutral' },
  ];

  const compRows = metrics.map(m => {
    const vals = scores.map(s => m.key === 'htmReturn' ? s.htmReturn : s.data[m.key]);
    const best = m.better === 'high' ? Math.max(...vals) : m.better === 'low' ? Math.min(...vals) : null;
    const cells = scores.map((s, i) => {
      const v = vals[i];
      const isBest = best !== null && v === best && new Set(vals).size > 1;
      return `<td style="padding:7px 12px;text-align:center;font-size:0.78rem;font-weight:${isBest?'700':'500'};color:${isBest?'#27ae60':'#444'};${isBest?'background:#f0fff8;':''}">
        ${m.fmt(v)} ${isBest?'<span style="font-size:0.6rem;">&#10003;</span>':''}
      </td>`;
    }).join('');
    return `<tr><td style="padding:7px 12px;font-size:0.72rem;font-weight:600;color:#666;">${m.label}</td>${cells}</tr>`;
  }).join('');

  // Reasons list for winner
  const reasonsHtml = winner.reasons.map(r => {
    const icon = r.type === 'positive' ? '+' : r.type === 'negative' ? '−' : '•';
    return `<li style="padding:4px 0;font-size:0.78rem;color:#444;">${icon} ${r.text}</li>`;
  }).join('');

  // Others weak points
  const othersHtml = others.map(s => {
    const negReasons = s.reasons.filter(r => r.type === 'negative' || r.type === 'info');
    if (!negReasons.length) return '';
    return `<div style="margin-top:8px;">
      <span style="font-size:0.72rem;font-weight:600;color:#888;">Obligasi ${s.label} (${esc(s.seri)}):</span>
      <ul style="list-style:none;padding:0;margin:4px 0 0 0;">
        ${negReasons.map(r => `<li style="padding:2px 0;font-size:0.72rem;color:#888;">${r.type==='negative'?'−':'•'} ${r.text}</li>`).join('')}
      </ul>
    </div>`;
  }).join('');

  // Render panel
  panel.innerHTML = `
  <div style="background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08);overflow:hidden;border:2px solid #e8f0ff;">
    <!-- Header -->
    <div style="background:linear-gradient(135deg,#667eea,#764ba2);padding:20px 24px;display:flex;align-items:center;gap:14px;">
      <div style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:800;color:#fff;">AI</div>
      <div>
        <div style="font-size:1rem;font-weight:800;color:#fff;">Rekomendasi AI</div>
        <div style="font-size:0.72rem;color:rgba(255,255,255,0.7);margin-top:2px;">Analisis otomatis berdasarkan YTM, kupon, harga, tenor & return</div>
      </div>
      <div style="margin-left:auto;text-align:right;">
        <div style="padding:4px 12px;border-radius:20px;background:${confidenceColor};color:#fff;font-size:0.68rem;font-weight:700;">${confidenceLabel}</div>
      </div>
    </div>

    <!-- Main Recommendation -->
    <div style="padding:20px 24px;border-bottom:1px solid #f0f0f5;">
      <div style="font-size:0.88rem;line-height:1.6;color:#333;">${mainText}</div>
      ${reasonsHtml ? `<ul style="list-style:none;padding:0;margin:12px 0 0 0;">${reasonsHtml}</ul>` : ''}
      ${othersHtml}
    </div>

    <!-- Comparison Matrix -->
    <div style="padding:16px 24px;">
      <div style="font-size:0.75rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;">Perbandingan Metrik</div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="border-bottom:2px solid #e8e8f5;">
              <th style="padding:8px 12px;text-align:left;font-size:0.65rem;font-weight:700;color:#aaa;text-transform:uppercase;">Metrik</th>
              ${compCols}
            </tr>
          </thead>
          <tbody>${compRows}</tbody>
        </table>
      </div>
    </div>

    <!-- Score Bar -->
    <div style="padding:14px 24px;background:#f8f9ff;border-top:1px solid #f0f0f5;">
      <div style="font-size:0.68rem;font-weight:600;color:#888;margin-bottom:8px;">Skor Keseluruhan</div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        ${scores.map((s, i) => {
          const barColor = i === 0 ? '#27ae60' : i === 1 ? '#f5a623' : '#888';
          const barWidth = (s.score / 100) * 100;
          return `<div style="flex:1;min-width:120px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
              <span style="font-size:0.72rem;font-weight:600;color:${i===0?'#27ae60':'#444'};">${i===0?'★ ':''}${s.label} — ${esc(s.seri)}</span>
              <span style="font-size:0.72rem;font-weight:700;color:${barColor};">${s.score.toFixed(0)}/100</span>
            </div>
            <div style="height:8px;background:#e8e8f0;border-radius:4px;overflow:hidden;">
              <div style="height:100%;width:${barWidth}%;background:${barColor};border-radius:4px;transition:width 0.5s;"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Disclaimer -->
    <div style="padding:10px 24px;background:#fffbf0;border-top:1px solid #f5e8c0;">
      <p style="font-size:0.65rem;color:#a85e00;margin:0;line-height:1.5;">
        <strong>Disclaimer:</strong> Hasil rekomendasi ini merupakan analisis berbasis AI yang disusun berdasarkan data dan angka yang tersedia. Rekomendasi belum mempertimbangkan kondisi pasar secara menyeluruh, faktor fundamental, likuiditas, maupun perkembangan terbaru di pasar. Mohon disesuaikan kembali dengan kondisi market terkini sebelum mengambil keputusan investasi.
      </p>
    </div>
  </div>`;
}
